[package]
name = "kai-bridge"
version = "0.1.0"
edition = "2021"
description = "Kai Fusion Rust bridge for Android — exposes kai_load_gguf, calculate_vfe, g_ij to JNI"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Real GGUF inference — actual llama.cpp with GPU (Vulkan) for Android — borrow GPU power to keep UI responsive
llama-cpp-2 = { version = "0.1.154", features = ["vulkan"] }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[profile.release]
lto = true
opt-level = 3
panic = "abort"

[package]
name = "kai-bridge"
version = "0.1.0"
edition = "2021"
description = "Kai Fusion Rust bridge for Android — exposes kai_load_gguf, calculate_vfe, g_ij to JNI"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Real GGUF: mmap + header validation (no heavy inference yet — VFE/physics wired)
memmap2 = "0.9"
# For future real inference: uncomment when wiring kai-fusion loader
# kai-fusion = { path = "../../rust/kai-fusion" }

[profile.release]
lto = true
opt-level = 3
panic = "abort"
